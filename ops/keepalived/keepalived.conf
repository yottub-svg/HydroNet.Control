vrrp_instance VI_HYDRONET {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1
    virtual_ipaddress { 10.20.0.10/24 }
    track_script { chk_hydronet }
}

vrrp_script chk_hydronet {
    script "/usr/local/bin/check-hydronet-health.sh"
    interval 1
    fall 2
    rise 2
}
